name: Destroy - SolidaryTech Environment (⚠️ DANGEROUS)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which environment to destroy?'
        required: true
        type: choice
        options:
          - primary
          - dr
          - both
        default: primary
      confirm_destruction:
        description: 'Type DESTROY to confirm'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: '1.5.7'

jobs:
  # ============================================================================
  # Confirmação de segurança
  # ============================================================================
  confirm:
    name: Safety Confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Verify destruction confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_destruction }}" != "DESTROY" ]; then
            echo "❌ Confirmation word mismatch. Expected: DESTROY"
            exit 1
          fi
          echo "✅ Destruction confirmed. Proceeding with caution..."

  # ============================================================================
  # Destruir Primary
  # ============================================================================
  destroy-primary:
    name: Destroy Primary Environment (us-east-1)
    runs-on: ubuntu-latest
    needs: confirm
    if: |
      github.event.inputs.environment == 'primary' ||
      github.event.inputs.environment == 'both'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS account ID
        id: aws
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "AWS Account: $ACCOUNT_ID"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init (Primary)
        working-directory: terraform/environments/primary
        env:
          ACCOUNT_ID: ${{ steps.aws.outputs.account_id }}
        run: |
          BUCKET="tc5-solidarytech-tfstate-${ACCOUNT_ID}"
          TABLE="tc5-solidarytech-tflock-${ACCOUNT_ID}"
          terraform init -reconfigure \
            -backend-config="bucket=${BUCKET}" \
            -backend-config="dynamodb_table=${TABLE}"

      - name: Pre-cleanup Kubernetes resources (Primary)
        run: |
          echo "⏳ Cleaning up Kubernetes resources..."

          # Delete namespaces (will cascade delete everything inside)
          echo "Deleting namespaces..."
          kubectl delete namespace solidarytech --ignore-not-found --wait=true 2>/dev/null || true
          kubectl delete namespace monitoring --ignore-not-found --wait=true 2>/dev/null || true
          kubectl delete namespace argocd --ignore-not-found --wait=true 2>/dev/null || true
          kubectl delete namespace ingress-nginx --ignore-not-found --wait=true 2>/dev/null || true

          # Wait for LoadBalancers to be deleted (they release ENIs and Elastic IPs)
          echo "Waiting for LoadBalancers to be released..."
          sleep 45

          echo "✅ Kubernetes resources cleaned"

      - name: Cleanup AWS Network Resources (Primary)
        run: |
          echo "⏳ Cleaning up orphaned AWS resources..."

          # Release unassociated Elastic IPs
          UNASSOC_IPS=$(aws ec2 describe-addresses --region us-east-1 --query 'Addresses[?AssociationId==null].AllocationId' --output text 2>/dev/null || true)
          if [ -n "$UNASSOC_IPS" ]; then
            echo "Releasing Elastic IPs: $UNASSOC_IPS"
            for ip in $UNASSOC_IPS; do
              aws ec2 release-address --allocation-id "$ip" --region us-east-1 2>/dev/null || true
            done
          fi

          # Delete orphaned ENIs
          ORPHAN_ENIS=$(aws ec2 describe-network-interfaces --region us-east-1 --query 'NetworkInterfaces[?Status==`available`].NetworkInterfaceId' --output text 2>/dev/null || true)
          if [ -n "$ORPHAN_ENIS" ]; then
            echo "Deleting orphaned ENIs: $ORPHAN_ENIS"
            for eni in $ORPHAN_ENIS; do
              aws ec2 delete-network-interface --network-interface-id "$eni" --region us-east-1 2>/dev/null || true
            done
          fi

          echo "✅ AWS resources cleaned"

      - name: Terraform Destroy (Primary)
        working-directory: terraform/environments/primary
        run: |
          echo "🔥 Destroying PRIMARY environment (us-east-1)..."
          terraform destroy -auto-approve -input=false -parallelism=10
          echo "✅ PRIMARY destroyed"

  # ============================================================================
  # Destruir DR
  # ============================================================================
  destroy-dr:
    name: Destroy DR Environment (us-west-2)
    runs-on: ubuntu-latest
    needs: confirm
    if: |
      github.event.inputs.environment == 'dr' ||
      github.event.inputs.environment == 'both'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-west-2

      - name: Get AWS account ID
        id: aws
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init (DR)
        working-directory: terraform/environments/dr
        env:
          ACCOUNT_ID: ${{ steps.aws.outputs.account_id }}
        run: |
          BUCKET="tc5-solidarytech-tfstate-${ACCOUNT_ID}"
          TABLE="tc5-solidarytech-tflock-${ACCOUNT_ID}"
          terraform init -reconfigure \
            -backend-config="bucket=${BUCKET}" \
            -backend-config="dynamodb_table=${TABLE}"

      - name: Pre-cleanup Kubernetes resources (DR)
        run: |
          echo "⏳ Cleaning up Kubernetes resources..."

          # Delete namespaces (will cascade delete everything inside)
          echo "Deleting namespaces..."
          kubectl delete namespace solidarytech --ignore-not-found --wait=true 2>/dev/null || true
          kubectl delete namespace monitoring --ignore-not-found --wait=true 2>/dev/null || true
          kubectl delete namespace argocd --ignore-not-found --wait=true 2>/dev/null || true
          kubectl delete namespace ingress-nginx --ignore-not-found --wait=true 2>/dev/null || true

          # Wait for LoadBalancers to be deleted (they release ENIs and Elastic IPs)
          echo "Waiting for LoadBalancers to be released..."
          sleep 45

          echo "✅ Kubernetes resources cleaned"

      - name: Cleanup AWS Network Resources (DR)
        run: |
          echo "⏳ Cleaning up orphaned AWS resources..."

          # Release unassociated Elastic IPs
          UNASSOC_IPS=$(aws ec2 describe-addresses --region us-west-2 --query 'Addresses[?AssociationId==null].AllocationId' --output text 2>/dev/null || true)
          if [ -n "$UNASSOC_IPS" ]; then
            echo "Releasing Elastic IPs: $UNASSOC_IPS"
            for ip in $UNASSOC_IPS; do
              aws ec2 release-address --allocation-id "$ip" --region us-west-2 2>/dev/null || true
            done
          fi

          # Delete orphaned ENIs
          ORPHAN_ENIS=$(aws ec2 describe-network-interfaces --region us-west-2 --query 'NetworkInterfaces[?Status==`available`].NetworkInterfaceId' --output text 2>/dev/null || true)
          if [ -n "$ORPHAN_ENIS" ]; then
            echo "Deleting orphaned ENIs: $ORPHAN_ENIS"
            for eni in $ORPHAN_ENIS; do
              aws ec2 delete-network-interface --network-interface-id "$eni" --region us-west-2 2>/dev/null || true
            done
          fi

          echo "✅ AWS resources cleaned"

      - name: Terraform Destroy (DR)
        working-directory: terraform/environments/dr
        run: |
          echo "🔥 Destroying DR environment (us-west-2)..."
          terraform destroy -auto-approve -input=false -parallelism=10
          echo "✅ DR destroyed"

  # ============================================================================
  # Resumo
  # ============================================================================
  summary:
    name: Destruction Summary
    runs-on: ubuntu-latest
    needs: [confirm, destroy-primary, destroy-dr]
    if: always()
    steps:
      - name: Print destruction summary
        run: |
          echo "## 🔥 Environment Destruction Complete"
          echo ""
          echo "**Destroyed Environments:**"
          if [[ "${{ github.event.inputs.environment }}" == "primary" || "${{ github.event.inputs.environment }}" == "both" ]]; then
            echo "- ✅ PRIMARY (us-east-1)"
          fi
          if [[ "${{ github.event.inputs.environment }}" == "dr" || "${{ github.event.inputs.environment }}" == "both" ]]; then
            echo "- ✅ DR (us-west-2)"
          fi
          echo ""
          echo "**Remaining Resources to Clean Up:**"
          echo "- Terraform state in S3 (kept for audit trail)"
          echo "- CloudWatch logs (kept for audit trail)"
          echo "- IAM roles (can be cleaned manually if needed)"
          echo ""
          echo "⚠️ **Note**: To fully clean up, run:"
          echo "  aws s3 rm s3://tc5-solidarytech-tfstate-ACCOUNT_ID --recursive"
          echo "  aws s3 rb s3://tc5-solidarytech-tfstate-ACCOUNT_ID"
          echo "  aws dynamodb delete-table --table-name tc5-solidarytech-tflock-ACCOUNT_ID"
