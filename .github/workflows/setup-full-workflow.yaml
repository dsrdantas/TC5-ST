name: Deploy - SolidaryTech Full Stack (Terraform + K8s)

on:
  workflow_dispatch:
    inputs:
      auto_approve:
        description: 'Skip terraform plan confirmation'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - deploy/main  # push nessa branch dispara deploy automático (opcional)
    paths:
      - 'terraform/**'
      - 'microservices/**'
      - 'gitops/**'
      - 'argocd/**'
      - '.github/workflows/setup-full-workflow.yaml'

permissions:
  contents: write    # Git commit para manifestos GitOps
  id-token: write    # Opcional: OIDC trust da AWS

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: '1.5.7'

jobs:
  # ============================================================================
  # Stage 1: Validações iniciais
  # ============================================================================
  pre-flight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    outputs:
      account_id: ${{ steps.aws-account.outputs.account_id }}
      terraform_version: ${{ steps.terraform.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate AWS credentials
        id: aws-account
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "AWS Account ID: $ACCOUNT_ID"
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT

          # Verificar se session expira em menos de 1h (aviso)
          EXPIRY=$(aws sts get-caller-identity 2>/dev/null || echo "")
          if [ -z "$EXPIRY" ]; then
            echo "❌ AWS credentials expired or invalid"
            exit 1
          fi
          echo "✅ AWS credentials valid"

      - name: Setup Terraform
        id: terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init (for validation)
        working-directory: terraform/environments/primary
        run: terraform init -backend=false -input=false

      - name: Terraform format check
        run: terraform fmt -recursive -check terraform/

      - name: Terraform validate
        working-directory: terraform/environments/primary
        run: terraform validate

      - name: Check docker
        run: docker --version && echo "✅ Docker available"

  # ============================================================================
  # Stage 2: Build + push imagens (paralelo)
  # ============================================================================
  build-images:
    name: Build & Push Images to ECR
    runs-on: ubuntu-latest
    needs: [pre-flight, terraform-apply]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, scan, and push images
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for svc in ngo-service donation-service volunteer-service; do
            echo "🏗️ Building $svc..."
            docker build --platform linux/amd64 \
              -t "$ECR_REGISTRY/$svc:$IMAGE_TAG" \
              -t "$ECR_REGISTRY/$svc:latest" \
              "microservices/$svc"

            echo "🔍 Scanning $svc with Trivy..."
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image \
              --severity CRITICAL,HIGH \
              --exit-code 0 \
              "$ECR_REGISTRY/$svc:$IMAGE_TAG" || true

            echo "📤 Pushing $svc..."
            docker push "$ECR_REGISTRY/$svc:$IMAGE_TAG"
            docker push "$ECR_REGISTRY/$svc:latest"
            echo "✅ $svc pushed"
          done

  # ============================================================================
  # Stage 3: Provisionar infraestrutura (Terraform)
  # ============================================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: pre-flight
    outputs:
      tfplan_exists: ${{ steps.plan.outputs.tfplan_exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Bootstrap backend
        run: ./scripts/bootstrap-backend.sh
        env:
          ACCOUNT_ID: ${{ needs.pre-flight.outputs.account_id }}

      - name: Terraform Init
        working-directory: terraform/environments/primary
        env:
          ACCOUNT_ID: ${{ needs.pre-flight.outputs.account_id }}
        run: |
          BUCKET="tc5-solidarytech-tfstate-${ACCOUNT_ID}"
          TABLE="tc5-solidarytech-tflock-${ACCOUNT_ID}"
          terraform init -reconfigure \
            -backend-config="bucket=${BUCKET}" \
            -backend-config="dynamodb_table=${TABLE}"

      - name: Terraform Plan
        id: plan
        working-directory: terraform/environments/primary
        run: |
          terraform plan -out=tfplan.binary -input=false
          if [ -f tfplan.binary ]; then
            echo "tfplan_exists=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload tfplan artifact
        if: steps.plan.outputs.tfplan_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/environments/primary/tfplan.binary
          retention-days: 1

  # ============================================================================
  # Stage 4: Apply infraestrutura
  # ============================================================================
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [pre-flight, terraform-plan]
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.auto_approve) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/deploy/main')
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Download tfplan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/environments/primary/

      - name: Terraform Init
        working-directory: terraform/environments/primary
        env:
          ACCOUNT_ID: ${{ needs.pre-flight.outputs.account_id }}
        run: |
          BUCKET="tc5-solidarytech-tfstate-${ACCOUNT_ID}"
          TABLE="tc5-solidarytech-tflock-${ACCOUNT_ID}"
          terraform init -reconfigure \
            -backend-config="bucket=${BUCKET}" \
            -backend-config="dynamodb_table=${TABLE}"

      - name: Terraform Apply
        working-directory: terraform/environments/primary
        run: |
          echo "🚀 Applying Terraform (this may take 15-20 minutes)..."
          terraform apply -input=false tfplan.binary
          echo "✅ Terraform apply completed"

  # ============================================================================
  # Stage 5: Pós-deploy (kubectl, ArgoCD, Monitoring)
  # ============================================================================
  post-deploy:
    name: Post-Deploy Configuration
    runs-on: ubuntu-latest
    needs: [pre-flight, terraform-apply]
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.31.0'

      - name: Setup Terraform (for output extraction)
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Get cluster credentials
        working-directory: terraform/environments/primary
        env:
          ACCOUNT_ID: ${{ needs.pre-flight.outputs.account_id }}
        run: |
          BUCKET="tc5-solidarytech-tfstate-${ACCOUNT_ID}"
          TABLE="tc5-solidarytech-tflock-${ACCOUNT_ID}"
          terraform init -reconfigure \
            -backend-config="bucket=${BUCKET}" \
            -backend-config="dynamodb_table=${TABLE}" \
            -input=false > /dev/null 2>&1

          OUTPUTS=$(terraform output -no-color 2>&1)
          CLUSTER_NAME=$(echo "$OUTPUTS" | grep '^cluster_name ' | awk -F ' = ' '{print $2}' | tr -d '"')
          REGION=$(echo "$OUTPUTS" | grep '^region ' | awk -F ' = ' '{print $2}' | tr -d '"')

          echo "CLUSTER_NAME=$CLUSTER_NAME"
          echo "REGION=$REGION"

          {
            echo "CLUSTER_NAME=$CLUSTER_NAME"
            echo "REGION=$REGION"
          } >> "$GITHUB_ENV"

          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$REGION"
          echo "✅ kubectl configured for $CLUSTER_NAME"

      - name: Generate and apply K8s secrets
        env:
          ACCOUNT_ID: ${{ needs.pre-flight.outputs.account_id }}
        run: |
          pushd terraform/environments/primary > /dev/null
          BUCKET="tc5-solidarytech-tfstate-${ACCOUNT_ID}"
          TABLE="tc5-solidarytech-tflock-${ACCOUNT_ID}"
          terraform init -reconfigure \
            -backend-config="bucket=${BUCKET}" \
            -backend-config="dynamodb_table=${TABLE}" \
            -input=false > /dev/null 2>&1
          popd > /dev/null

          ./scripts/generate-secrets.sh
          ./scripts/apply-secrets.sh
          echo "✅ K8s secrets gerados e aplicados"

      - name: Substitute placeholders in deployments
        env:
          ACCOUNT_ID: ${{ needs.pre-flight.outputs.account_id }}
        run: |
          for svc in ngo-service donation-service volunteer-service; do
            MANIFEST="gitops/$svc/deployment.yaml"
            sed -i.bak "s|<AWS_ACCOUNT_ID>|${ACCOUNT_ID}|g" "$MANIFEST"
            rm -f "$MANIFEST.bak"
          done
          echo "✅ Placeholders substituídos"

      - name: Verify GitOps manifests have latest tag
        run: |
          for svc in ngo-service donation-service volunteer-service; do
            if ! grep -q "image:.*${svc}:latest" gitops/$svc/deployment.yaml; then
              echo "⚠️  Warning: $svc deployment not using :latest tag"
            fi
          done
          echo "✅ GitOps manifests verified (using :latest)"

      - name: Install ArgoCD
        run: |
          if ! kubectl get namespace argocd &> /dev/null; then
            kubectl create namespace argocd
            kubectl apply -n argocd \
              -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml \
              --server-side
            kubectl wait --for=condition=available --timeout=300s \
              deployment/argocd-server -n argocd
            kubectl patch svc argocd-server -n argocd \
              -p '{"spec": {"type": "LoadBalancer"}}'
            echo "✅ ArgoCD installed"
          else
            echo "✅ ArgoCD already installed"
          fi

      - name: Install NGINX Ingress
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.0/deploy/static/provider/aws/deploy.yaml 2>/dev/null || true
          echo "✅ NGINX Ingress installed"

      - name: Deploy applications via ArgoCD
        env:
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          sed "s|<GITHUB_USER>|${GITHUB_USER}|g" argocd/applications.yaml | kubectl apply -f -
          echo "⏳ Waiting for deployments to be ready..."
          kubectl rollout status deployment/ngo-service -n solidarytech --timeout=180s || true
          kubectl rollout status deployment/donation-service -n solidarytech --timeout=180s || true
          kubectl rollout status deployment/volunteer-service -n solidarytech --timeout=180s || true
          echo "✅ Applications deployed"

      - name: Setup Self-Healing Bridge Secret
        env:
          PAT_TOKEN_SELF_HEALING: ${{ secrets.PAT_TOKEN_SELF_HEALING }}
        run: |
          if [ -z "$PAT_TOKEN_SELF_HEALING" ]; then
            echo "⚠️  PAT_TOKEN_SELF_HEALING secret not configured"
            echo "   Set it in: Settings → Secrets and variables → Actions → New repository secret"
            echo "   Name: PAT_TOKEN_SELF_HEALING"
            echo "   Value: your fine-grained PAT (ghp_...)"
            echo ""
            echo "   ⚠️  NOTA: Não pode começar com GITHUB_ (reservado pelo GitHub Actions)"
            exit 1
          fi
          chmod +x scripts/setup-self-healing-secret.sh
          ./scripts/setup-self-healing-secret.sh

      - name: Deploy Self-Healing Bridge (with GITHUB_USER substitution)
        env:
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          sed "s|<GITHUB_USER>|${GITHUB_USER}|g" gitops/monitoring/self-healing-bridge/deployment.yaml | kubectl apply -f -
          echo "⏳ Waiting for self-healing-bridge to be ready..."
          kubectl rollout status deployment/self-healing-bridge -n monitoring --timeout=60s || true
          echo "✅ Self-Healing Bridge deployed"

      - name: Install Monitoring Stack
        run: ./scripts/install-monitoring.sh

      - name: Install Velero
        run: ./scripts/install-velero.sh

      - name: Post-deploy summary
        run: |
          echo "## 🎉 Deployment Complete"
          ARGOCD_LB=$(kubectl get svc argocd-server -n argocd -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "pending")
          GRAFANA_LB=$(kubectl get svc prometheus-grafana -n monitoring -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "pending")
          INGRESS_LB=$(kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "pending")
          echo "- **ArgoCD**: https://$ARGOCD_LB (user: admin)"
          echo "- **Grafana**: http://$GRAFANA_LB (user: admin, pass: kubectl get secret grafana-admin -n monitoring -o jsonpath='{.data.admin-password}' | base64 -d)"
          echo "- **Ingress**: http://$INGRESS_LB"
          echo "- **Cluster**: $CLUSTER_NAME ($REGION)"

  # ============================================================================
  # Stage 6: Notificações
  # ============================================================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [pre-flight, post-deploy]
    if: always()
    steps:
      - name: Deployment status
        run: |
          if [[ "${{ needs.post-deploy.result }}" == "success" ]]; then
            echo "✅ SolidaryTech deployment successful!"
          else
            echo "❌ Deployment failed. Check logs above."
            exit 1
          fi
