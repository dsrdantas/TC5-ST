---
# Webhook receiver — converte alertas do Alertmanager em GitHub Actions workflow_dispatch
apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-receiver-script
  namespace: monitoring
data:
  receiver.py: |
    #!/usr/bin/env python3
    import json
    import sys
    import os
    from http.server import HTTPServer, BaseHTTPRequestHandler
    import urllib.request
    import urllib.error

    GITHUB_TOKEN = os.getenv('GITHUB_TOKEN', '')
    GITHUB_REPO = os.getenv('GITHUB_REPO', 'dsrdantas/TC5-ST')
    GITHUB_WORKFLOW = 'self-healing.yaml'

    class WebhookHandler(BaseHTTPRequestHandler):
        def do_GET(self):
            # Health check endpoint
            if self.path in ['/health', '/webhook']:
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b'OK')
            else:
                self.send_response(404)
                self.end_headers()
                self.wfile.write(b'Not Found')

        def do_POST(self):
            if self.path != '/webhook':
                self.send_response(404)
                self.end_headers()
                self.wfile.write(b'Not Found')
                return

            # Ler payload
            content_length = int(self.headers.get('Content-Length', 0))
            body = self.rfile.read(content_length)

            try:
                payload = json.loads(body)
                self.process_alert(payload)
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b'OK')
            except Exception as e:
                print(f"Error: {e}", file=sys.stderr)
                self.send_response(500)
                self.end_headers()
                self.wfile.write(b'Internal Server Error')

        def process_alert(self, payload):
            if not payload.get('alerts'):
                print("No alerts in payload")
                return

            alert = payload['alerts'][0]
            alertname = alert.get('labels', {}).get('alertname', 'unknown')
            severity = alert.get('labels', {}).get('severity', 'warning')
            service = alert.get('labels', {}).get('service', 'donation-service')
            description = alert.get('annotations', {}).get('description', 'Auto-triggered by Alertmanager')

            print(f"[Webhook] Alert: {alertname} | Severity: {severity} | Service: {service}")

            # Decidir se dispara self-healing
            should_heal = alertname in ['PodCrashLooping', 'HighErrorRate5xx', 'DonationSLOFastBurn']

            if should_heal:
                print(f"✅ Disparando self-healing para {service}...")
                self.trigger_workflow(service, alertname, severity, description)
            else:
                print(f"⚠️  Alert {alertname} não dispara self-healing")

        def trigger_workflow(self, service, alertname, severity, description):
            if not GITHUB_TOKEN:
                print("ERROR: GITHUB_TOKEN não configurado")
                return

            url = f"https://api.github.com/repos/{GITHUB_REPO}/actions/workflows/{GITHUB_WORKFLOW}/dispatches"
            payload = {
                "ref": "main",
                "inputs": {
                    "service": service,
                    "reason": f"Auto-heal via Alertmanager: {alertname} ({severity}) — {description}"
                }
            }
            payload_json = json.dumps(payload).encode('utf-8')

            print(f"[GitHub] URL: {url}")
            print(f"[GitHub] Service: {service}, Workflow: {GITHUB_WORKFLOW}")

            headers = {
                'Authorization': f'token {GITHUB_TOKEN[:10]}...',  # Log apenas primeiros 10 chars
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            }

            try:
                print(f"[GitHub] Enviando POST para {url}...")
                req = urllib.request.Request(url, data=payload_json, headers=headers, method='POST')
                with urllib.request.urlopen(req) as response:
                    if response.status in [200, 201, 204]:
                        print("✅ Workflow_dispatch enviado com sucesso")
                        return True
                    else:
                        print(f"⚠️  Status inesperado: {response.status}")
                        return False
            except urllib.error.HTTPError as e:
                print(f"❌ Erro HTTP {e.code}: {e.reason}")
                print(f"[DEBUG] Response: {e.read().decode('utf-8')}")
                return False
            except urllib.error.URLError as e:
                print(f"❌ Erro de conexão: {e.reason}")
                return False
            except Exception as e:
                print(f"❌ Erro desconhecido: {type(e).__name__}: {e}")
                return False

        def log_message(self, format, *args):
            # Suppress default logging
            pass

    if __name__ == '__main__':
        server = HTTPServer(('0.0.0.0', 8080), WebhookHandler)
        print("Webhook receiver listening on port 8080...")
        server.serve_forever()

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webhook-receiver
  namespace: monitoring

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-receiver
  namespace: monitoring
  labels:
    app.kubernetes.io/name: webhook-receiver
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook-receiver
        app.kubernetes.io/component: monitoring
    spec:
      serviceAccountName: webhook-receiver
      containers:
        - name: receiver
          image: python:3.11-alpine
          command:
            - python3
            - /scripts/receiver.py
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-webhook-token
                  key: token
                  optional: true
            - name: GITHUB_REPO
              value: "dsrdantas/TC5-ST"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /webhook
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /webhook
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: webhook-receiver-script
            defaultMode: 0755

---
apiVersion: v1
kind: Service
metadata:
  name: webhook-receiver
  namespace: monitoring
  labels:
    app.kubernetes.io/name: webhook-receiver
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: webhook-receiver
