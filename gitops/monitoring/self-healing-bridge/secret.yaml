# Self-Healing Bridge Secret
# GitHub PAT with "Actions: write" permission for repository_dispatch API
#
# IMPORTANTE: Este é um template. O token real deve vir de um GitHub Secret.
#
# Opção 1: Usando GitHub Secret (recomendado para CI/CD)
# ========================================================
# 1. Ir para: GitHub Repo → Settings → Secrets and variables → Actions
# 2. Criar secret: PAT_TOKEN_SELF_HEALING (fine-grained PAT com Actions: write)
#    ⚠️  NOTA: Não pode começar com GITHUB_ (reservado pelo GitHub Actions)
# 3. Workflow cria o secret Kubernetes usando:
#    kubectl create secret generic self-healing-bridge-secret \
#      --from-literal=GITHUB_TOKEN='${{ secrets.PAT_TOKEN_SELF_HEALING }}' \
#      -n monitoring
#
# Opção 2: Criação manual (apenas para ambiente local/dev)
# =========================================================
# kubectl create secret generic self-healing-bridge-secret \
#   --from-literal=GITHUB_TOKEN='ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx' \
#   -n monitoring
#
---
apiVersion: v1
kind: Secret
metadata:
  name: self-healing-bridge-secret
  namespace: monitoring
type: Opaque
stringData:
  # PLACEHOLDER: Será substituído por GitHub Secret no workflow
  # Estrutura esperada: ghp_... (fine-grained PAT)
  GITHUB_TOKEN: "${{ secrets.PAT_TOKEN_SELF_HEALING }}"
